apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: properties-sql
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 10Gi
---
apiVersion: v1
kind: Service
metadata:
  name: properties-sql
spec:
  selector: {app: properties-sql}
  ports:
    - {name: sql, port: 1433, targetPort: 1433}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: properties-sql
spec:
  progressDeadlineSeconds: 1800
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: properties-sql}
  template:
    metadata:
      labels: {app: properties-sql}
    spec:
      automountServiceAccountToken: false
      nodeSelector: {kubernetes.io/arch: amd64}
      securityContext: {fsGroup: 10001}
      containers:
        - name: sql
          image: mcr.microsoft.com/mssql/server:2022-latest@sha256:4525e3efac9f3e241cb003bb2ff2a82818b502f37e12049d788b1a9fa7e13b7f
          env:
            - {name: ACCEPT_EULA, value: "Y"}
            - {name: MSSQL_PID, value: Developer}
            - name: MSSQL_SA_PASSWORD
              valueFrom:
                secretKeyRef: {name: properties-sql-admin, key: password}
          resources:
            requests: {cpu: 500m, memory: 2Gi}
            limits: {memory: 4Gi}
          readinessProbe:
            tcpSocket: {port: 1433}
            periodSeconds: 5
          volumeMounts:
            - {name: data, mountPath: /var/opt/mssql}
      volumes:
        - name: data
          persistentVolumeClaim: {claimName: properties-sql}
