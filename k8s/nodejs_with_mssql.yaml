
apiVersion: v1
kind: Service
metadata:
  name: properties-web
spec:
  type: LoadBalancer   # 新增这一行
  selector:
    app: properties-web
  ports:
    - port: 80
      targetPort: 8080
---

apiVersion: v1
kind: Secret
metadata:
  name: mysql-secret
type: Opaque
stringData:
  MYSQL_PASSWORD: "P@ssw0rd#123"

---

apiVersion: apps/v1
kind: Deployment
metadata:
  name: properties-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: properties-web
  template:
    metadata:
      labels:
        app: properties-web
    spec:
      containers:
        - name: web
          image: docker.io/alexchui210246098/properties-web:nodejs   # 或你指定的 tag
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          ports:
            - containerPort: 8080
          env:
            - name: DB_HOST
              value: "tf-sql-server-01.database.windows.net"                    # Service 名称
            - name: DB_PORT
              value: "1433"
            - name: DB_NAME
              value: "properties"
            - name: DB_USER
              value: "sqladmin"
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: mysql-secret
                  key: MYSQL_PASSWORD           # 与 MySQL 的 MYSQL_PASSWORD 保持一致