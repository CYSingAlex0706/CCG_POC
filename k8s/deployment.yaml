# =====================================================================
# properties-web — 单文件 K8s 部署清单
#   kubectl apply -f k8s/all.yaml
#   kubectl -n properties rollout status deploy/properties-web
#
# ⚠️ 部署前必须替换:
#   1. image: docker.io/YOUR_USER/properties-web:1.0.0
#   2. Secret 里的 DB_PASSWORD / REDIS_PASSWORD
#   3. ConfigMap 里的 DB_HOST / REDIS_HOST(换成你的真实 endpoint)
#   4. Ingress 里的 host
# =====================================================================


# ---------------------------------------------------------------------
# 1. Namespace
# ---------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: properties

---
# ---------------------------------------------------------------------
# 2. Secret — 凭证(生产环境用 SealedSecret / ESO / Vault 替代)
# ---------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: properties-secret
  namespace: properties
type: Opaque
stringData:
  DB_USER: app
  DB_PASSWORD: "DB_PASSWORD"
  REDIS_PASSWORD: "REDIS_PASSWORD"          # Redis 无密码就留空字符串

---
# ---------------------------------------------------------------------
# 3. ConfigMap — 应用配置(非敏感)
#    DB_HOST 可以是:K8s service 名 / 集群内 IP / RDS / Cloud SQL / Azure DB
# ---------------------------------------------------------------------
apiVersion: v1
kind: ConfigMap
metadata:
  name: properties-config
  namespace: properties
data:
  DB_HOST: "properties-db.xxxxx.eu-west-1.rds.amazonaws.com"
  DB_PORT: "3306"
  DB_NAME: "properties"
  REDIS_HOST: "properties-redis.xxxxx.cache.amazonaws.com"
  REDIS_PORT: "6379"
  REDIS_DB: "0"
  REDIS_TTL: "60"

---

# ---------------------------------------------------------------------
# 4. Deployment — 应用本体
#
# 三探针设计要点:
#   liveness  = tcpSocket,只看 Apache 进程存活 → 失败才重启 pod
#               ❌ 绝对不能放 DB 检查,否则 DB 抖动会导致全集群 CrashLoop
#   readiness = /health.php,检查 DB+Redis → 失败只摘流量,pod 不重启
#   startup   = 给冷启动留时间,先于 liveness 生效
# ---------------------------------------------------------------------
apiVersion: apps/v1
kind: Deployment
metadata:
  name: properties-web
  namespace: properties
  labels:
    app: properties-web
spec:
  replicas: 2
  selector:
    matchLabels:
      app: properties-web
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: properties-web
      annotations:
        # 若你的 APM 用 auto-inject(如 Datadog admission controller),这里可加注解
        # ad.datadoghq.com/web.logs: '[{"source":"php","service":"properties-web"}]'
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 33               # www-data
        runAsGroup: 33
        fsGroup: 33
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          # ⚠️ 替换成你的 Docker Hub 仓库
          image: docker.io/YOUR_USER/properties-web:1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef: { name: properties-config }
            - secretRef:    { name: properties-secret }
          resources:
            requests: { cpu: 50m,  memory: 128Mi }
            limits:   { cpu: 500m, memory: 512Mi }

          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /health.php
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5          # DB 连接超时 3s,留 2s 余量
            failureThreshold: 2
            successThreshold: 1

          startupProbe:
            httpGet:
              path: /health.php
              port: http
            failureThreshold: 30
            periodSeconds: 5
            timeoutSeconds: 5

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false     # PHP/Apache 需要写 /tmp;生产可改为 true + emptyDir
            capabilities:
              drop: ["ALL"]

          # 云 DB 需要 TLS 时,挂 secret 并启用 DB_SSL_CA(见文末注释)
          # volumeMounts:
          #   - name: db-ca
          #     mountPath: /etc/ssl
          #     readOnly: true
      # volumes:
      #   - name: db-ca
      #     secret:
      #       secretName: db-ca-cert

---
# ---------------------------------------------------------------------
# 5. Service — 集群内访问 + 供 Ingress / 监控抓取
# ---------------------------------------------------------------------
apiVersion: v1
kind: Service
metadata:
  name: properties-web
  namespace: properties
  labels:
    app: properties-web
spec:
  type: ClusterIP
  selector:
    app: properties-web
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP


---
# ---------------------------------------------------------------------
# 6. Ingress — 对外暴露,供 blackbox / Uptime 探测
#    如果你的监控工具只在集群内,可删掉这段,直接用 Service DNS:
#      http://properties-web.properties.svc.cluster.local/health.php
# ---------------------------------------------------------------------
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: properties-web
  namespace: properties
  annotations:
    nginx.ingress.kubernetes.io/proxy-connect-timeout: "5"
    nginx.ingress.kubernetes.io/proxy-read-timeout:    "30"
spec:
  ingressClassName: nginx
  rules:
    - host: properties.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: properties-web
                port:
                  number: 80
  # TLS 可选
  # tls:
  #   - hosts: [properties.example.com]
  #     secretName: properties-tls