<!doctype html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>銷售文件 · 華懋物業銷售系統</title>
<link rel="stylesheet" href="/app.css">
<!-- Solution 1: shared bootstrap downloads the Guance SDK asynchronously. -->
<script src="/js/guance-rum.js"></script>
</head>
<body>
<header class="topbar">
  <a class="brand" href="/">
    <span class="brand-mark">華</span>
    <span><span class="brand-name">CHINACHEM GROUP</span><br><span class="brand-sub">Property Sales · Observability</span></span>
  </a>
  <nav class="navlinks">
    <a href="/">APM 觀測台</a>
    <a href="/sales.html" class="active">物業銷售</a>
    <a href="/legacy">舊版頁面</a>
  </nav>
  <div class="topbar-right">
    <span class="env-chip">DEMO</span>
    <span><span class="status-dot" id="statusDot"></span> <span id="healthText" style="font-size:12px;color:rgba(255,255,255,.8)">檢查中…</span></span>
    <span class="clock" id="clock">--:--:--</span>
  </div>
</header>

<main class="page page-narrow">
  <div class="crumb"><a href="/sales.html">物業銷售</a> / 銷售文件詳情</div>
  <div id="content"><div class="card"><div class="card-body empty">載入中…</div></div></div>
  <div class="page-foot"><span>Chinachem Group — Property Sales APM Demo</span><span id="timing"></span></div>
</main>

<script src="/js/rum.js"></script>
<script>
(function () {
  'use strict';
  const { apiFetch, renderHealthInto, clockInto } = window.RUM;
  renderHealthInto(document.getElementById('healthText'));
  clockInto(document.getElementById('clock'));
  const $ = id => document.getElementById(id);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;',
  }[c]));

  const id = new URLSearchParams(location.search).get('id');
  const t0 = performance.now();
  if (!id) {
    $('content').innerHTML = '<div class="card"><div class="card-body empty" style="color:var(--danger)">缺少文件編號</div></div>';
    return;
  }
  apiFetch('/api/documents/' + encodeURIComponent(id)).then(async res => {
    if (!res.ok) throw new Error('HTTP ' + res.status + (res.status === 500 ? ' · 資料庫錯誤' : ''));
    return res.json();
  }).then(d => {
    $('timing').textContent = '查詢 ' + Math.round(performance.now() - t0) + 'ms';
    $('content').innerHTML = `
      <div class="detail-grid">
        <div class="card">
          <div class="card-head"><span class="card-title">${esc(d.reference)}</span><span class="badge ${esc(d.status)}">${esc(d.status)}</span></div>
          <div class="card-body"><dl class="detail">
            <dt>物業地址</dt><dd>${esc(d.property_address)}</dd>
            <dt>地區</dt><dd>${esc(d.city)}</dd>
            <dt>類型</dt><dd>${esc(d.property_type)}</dd>
            <dt>成交價</dt><dd style="font-size:17px;color:var(--forest-900)">HK$${Math.round(Number(d.price) || 0).toLocaleString('en-US')}</dd>
            <dt>成交日期</dt><dd class="mono">${esc(String(d.sale_date).slice(0, 10))}</dd>
            <dt>文件類型</dt><dd>${esc(d.document_type)}</dd>
            <dt>最後更新</dt><dd class="mono">${esc(d.updated_at)}</dd>
          </dl></div>
        </div>
        <div class="card">
          <div class="card-head"><span class="card-title">觀測資訊</span></div>
          <div class="card-body">
            <div class="chaos-row"><span class="chaos-label">請求狀態</span><span class="badge ok">200 OK</span></div>
            <div class="chaos-row"><span class="chaos-label">前端耗時</span><span class="mono">${Math.round(performance.now() - t0)} ms</span></div>
            <div class="chaos-row"><span class="chaos-label">資料模式</span><span class="mono">demo</span></div>
            <div style="margin-top:16px"><a class="btn ghost sm" href="/">查看 APM 觀測台 →</a></div>
          </div>
        </div>
      </div>`;
  }).catch(e => {
    $('timing').textContent = '失敗 ' + Math.round(performance.now() - t0) + 'ms';
    $('content').innerHTML = `<div class="card"><div class="card-body empty" style="color:var(--danger)">
      無法載入文件：${esc(e.message)}<br><span style="font-size:11px;color:var(--muted)">此錯誤已記錄至 APM 觀測台的錯誤日誌</span>
      <div style="margin-top:16px"><a class="btn ghost sm" href="/sales.html">返回銷售頁</a></div></div></div>`;
  });
})();
</script>
</body>
</html>
