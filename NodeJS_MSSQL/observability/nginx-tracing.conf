otel_exporter {
    endpoint 127.0.0.1:4317;
    interval 1s;
    batch_size 64;
}
otel_service_name guance-poc-nginx;
otel_resource_attr host.name CCG-Mock-APM;
otel_resource_attr env poc;
otel_resource_attr version 1.0.0;
otel_resource_attr project guance-poc;
map $uri $guance_poc_trace_route {
    ~^/document/[0-9]+$ /document/:id;
    default $uri;
}
