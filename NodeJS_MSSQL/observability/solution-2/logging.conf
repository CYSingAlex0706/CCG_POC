[[inputs.logging]]
  logfiles = ["/var/log/ccg-s2/application.log"]
  source = "ccg-s2-app"
  service = "ccg-s2-api"
  json_as_fields = true
  enable_multiline = false
  from_beginning = true
  [inputs.logging.tags]
    solution = "s2"
    env = "poc"
    version = "s2-1.0.0"
[[inputs.logging]]
  logfiles = ["/var/log/nginx/ccg-s2-access.log"]
  source = "ccg-s2-nginx"
  service = "ccg-s2-nginx"
  json_as_fields = true
  enable_multiline = false
  from_beginning = true
  [inputs.logging.tags]
    solution = "s2"
    env = "poc"
    version = "s2-1.0.0"
[[inputs.logging]]
  logfiles = ["/var/log/nginx/ccg-s2-error.log"]
