[inputs.container]
  endpoints = ["unix:///var/run/docker.sock"]
  metric_collect_interval = "15s"
  enable_container_metric = true
  enable_k8s_metric = false
  enable_k8s_event = false
  # SQL Server errorlog is collected explicitly; avoid duplicate stdout logs.
  container_exclude_log = ["image:*"]
  [inputs.container.tags]
    solution = "s2"
    env = "poc"
    version = "s2-1.0.0"
