server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log /var/log/nginx/ccg-s2-access.log ccg_s2_json;
    error_log /var/log/nginx/ccg-s2-error.log;
    location = /v1/write/rum {
        otel_trace off;
        proxy_pass http://127.0.0.1:9529;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }
    location = /v1/write/rum/replay {
        otel_trace off;
        proxy_pass http://127.0.0.1:9529;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        client_max_body_size 10m;
    }
    location / {
        # Continue the browser Trace, add a gateway Span, propagate to Node.js.
        otel_trace on;
        otel_trace_context propagate;
        otel_span_name "$request_method $ccg_s2_route";
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
# Local-only gateway metric endpoint; never proxy this publicly.
server {
    listen 127.0.0.1:8088;
    server_name localhost;
    access_log off;
    location = /basic_status {
        stub_status;
        allow 127.0.0.1;
        deny all;
    }
}
