# 放入 Nginx http 上下文的 include 目录。模块须先在 main 上下文加载。
log_format guance_poc_json escape=json '{"timestamp":"$time_iso8601","message":"$request_method $uri","http_method":"$request_method","path":"$uri","http_status_code":$status,"duration_seconds":$request_time,"trace_id":"$otel_trace_id","span_id":"$otel_span_id"}';
server {
    listen 80;
    server_name _; # 替换为客户域名；HTTPS 由客户证书配置
    access_log /var/log/nginx/guance-poc-access.log guance_poc_json;
    error_log /var/log/nginx/guance-poc-error.log;
    location = /v1/write/rum {
        proxy_pass http://127.0.0.1:9529;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }
    location = /v1/write/rum/replay {
        proxy_pass http://127.0.0.1:9529;
        proxy_set_header Host $host;
        client_max_body_size 10m;
    }
    location / {
        include /etc/nginx/guance-poc-tracing-location.conf;
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
