[[inputs.opentelemetry]]
  customer_tags_all = true
  split_service_name = false
  # Do not generate trace-derived metrics in Solution 1.
  tracing_metric_enable = false
  [inputs.opentelemetry.http]
    http_status_ok = 200
    trace_api = "/otel/v1/traces"
    metric_api = "/otel/v1/metrics"
    logs_api = "/otel/v1/logs"
  [inputs.opentelemetry.grpc]
    addr = "127.0.0.1:4317"
