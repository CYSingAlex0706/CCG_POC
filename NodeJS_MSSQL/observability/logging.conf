[[inputs.logging]]
  logfiles = ["/var/log/ccg-mssql/application.log"]
  source = "ccg-mssql-app"
  service = "ccg-mssql"
  json_as_fields = true
  enable_multiline = false
  [inputs.logging.tags]
    env = "poc"
    project = "CCG_POC"
[[inputs.logging]]
  logfiles = ["/var/lib/docker/volumes/ccg-mssql-data/_data/log/errorlog"]
  source = "ccg-mssql-db"
  service = "ccg-mssql-db"
  enable_multiline = false
  [inputs.logging.tags]
    env = "poc"
    project = "CCG_POC"

[[inputs.logging]]
  logfiles = ["/var/log/nginx/guance-poc-access.log"]
  source = "guance-poc-nginx"
  service = "guance-poc-nginx"
  json_as_fields = true
  enable_multiline = false
  [inputs.logging.tags]
    env = "poc"
    project = "CCG_POC"
