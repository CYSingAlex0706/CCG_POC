[Service]
Environment="NODE_OPTIONS=--require @beacon-observability/nodejs/register"
Environment="OTEL_SERVICE_NAME=ccg-mssql"
Environment="OTEL_RESOURCE_ATTRIBUTES=env=poc,version=1.0.0,service.version=1.0.0,deployment.environment.name=poc,host.name=CCG-Mock-APM,project=ccg-mssql"
Environment="OTEL_EXPORTER_OTLP_ENDPOINT=http://127.0.0.1:4317"
Environment="OTEL_EXPORTER_OTLP_PROTOCOL=grpc"
Environment="OTEL_TRACES_EXPORTER=otlp"
Environment="OTEL_METRICS_EXPORTER=otlp"
Environment="OTEL_LOGS_EXPORTER=none"
Environment="OTEL_METRIC_EXPORT_INTERVAL=15000"
Environment="OTEL_TRACES_SAMPLER=always_on"
Environment="OTEL_PROPAGATORS=tracecontext,baggage"
Environment="OTEL_NODE_RESOURCE_DETECTORS=env,host,os,process"
Environment="OTEL_NODE_ENABLED_INSTRUMENTATIONS=http,express,runtime-node,tedious"
Environment="OTEL_LOG_LEVEL=warn"
Environment="OTEL_PROFILING_ENABLED=true"
Environment="OTEL_PROFILING_MEMORY_ENABLED=false"
Environment="OTEL_PROFILING_PPROF_UPLOAD_URL=http://127.0.0.1:9529/profiling/v1/input"
Environment="OTEL_PROFILING_EXPORT_INTERVAL=60"
StandardOutput=append:/var/log/ccg-mssql/application.log
StandardError=append:/var/log/ccg-mssql/application.log
EnvironmentFile=/etc/ccg-mssql/app.env
